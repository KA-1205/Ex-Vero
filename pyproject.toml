[project]
name = "edge-node"
version = "0.1.0"
description = "Aegis Edge — offline-first edge memory kernel device node"
readme = "README.md"
authors = [
    { name = "Kartik Arora", email = "kartikarora.1205@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "pillow>=10.0.0",
    "python-multipart>=0.0.20",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "qdrant-edge-py==0.8.0",
    # Server-side client for the Cloud Gateway module. The edge node itself never
    # imports this (invariant 8 — the query path stays offline), but
    # tests/test_cloud_gateway.py exercises the gateway's app module, so the root
    # env needs it. Pinned to the same version as cloud-gateway/requirements.txt.
    "qdrant-client==1.12.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: requires the docker-compose gateway + Qdrant Server (skipped by default)",
]

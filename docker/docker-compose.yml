# Aegis Edge — Phase 3 hub stack: a real Qdrant Server + the Cloud Gateway.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Then run the integration test against it:
#   GATEWAY_URL=http://localhost:8088 \
#     .venv/bin/python -m pytest tests/test_sync.py -m integration -q
#
# Qdrant is the only datastore; the gateway holds `facts` + `fact_events`
# collections and nothing else.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant's readiness endpoint; the gateway waits on it before starting.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ../cloud-gateway
      dockerfile: Dockerfile
    environment:
      # The gateway reaches Qdrant Server over the compose network by service name.
      QDRANT_URL: "http://qdrant:6333"
    ports:
      - "8088:8088"
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:

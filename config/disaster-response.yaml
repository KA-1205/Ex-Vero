# Model Adapter Registry (backend.md §3.2). Which models run is declared here
# and resolved into adapter objects at startup; swapping a model is a one-line
# edit. `dim` is derived from the model, never hardcoded (fakes excepted).
models:
  embedders:
    - name: text
      modality: text
      provider: fastembed
      model: BAAI/bge-small-en-v1.5
      version: bge-small-en-v1.5
    # Cross-modal CLIP (text query -> photo) is available via the registry and
    # covered by tests/test_registry.py; enable it here to index images:
    # - name: image
    #   modality: vision
    #   provider: fastembed
    #   model: Qdrant/clip-ViT-B-32
    #   version: clip-ViT-B-32
  sparse:
    - name: text_bm25
      provider: qdrant-edge   # BM25 is built into Qdrant Edge — no extra lib
      modifier: idf

policy:
  novelty_threshold_high: 0.98
  novelty_threshold_low: 0.70
  urgency_keywords:
    - "structural collapse"
    - "gas"
    - "no pulse"
    - "bleeding"
    - "unconscious"
  urgency_threshold: 0.8
  pii_patterns:
    - "\\b\\d{3}-\\d{2}-\\d{4}\\b"  # SSN
    - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"  # email
  required_fields: ["status", "client_timestamp_ns", "reporter_device_id"]
  bandwidth: "FULL"
  trust_decay: 0.3

conflict:
  # Fused (RRF) score above which two same-zone reports with different keys
  # are flagged as POSSIBLE_CONFLICT for human review. RRF scores are small
  # (~1/(k+rank) per leg), so this threshold lives near 0.01, not 0.5.
  similarity_threshold: 0.01

hub:
  # The edge node talks to the Cloud Gateway (cloud-gateway/), which owns the
  # Qdrant Server hub. This is the gateway URL, not Qdrant's 6333 port.
  url: "http://localhost:8088"
  api_key: ""
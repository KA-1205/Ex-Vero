name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_model_suite:
        description: Run all tests, downloading pretrained checkpoints (external service tests may skip)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deterministic-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Offline API, consensus, sync policy, telemetry, stamps and repository checks
        run: >-
          python -m pytest -q tests/test_offline_api.py tests/test_consensus.py
          tests/test_sync_gate.py tests/test_telemetry_cgroup.py
          tests/test_model_stamp.py tests/test_repo_hygiene.py --junitxml=test-results.xml
      - name: Offline wiring benchmark (not semantic model evaluation)
        run: python tools/benchmark_report.py --offline --samples 20 --output results/ci-wiring-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-backend-evidence
          path: |
            test-results.xml
            results/ci-wiring-benchmark.json
  full-model-suite:
    if: github.event_name == 'workflow_dispatch' && inputs.full_model_suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest tests -q --junitxml=full-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-model-test-results
          path: full-test-results.xml
